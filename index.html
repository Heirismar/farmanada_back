<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script defer src="index.js" type="module"></script> <!-- Vincular el script -->
        <script defer src="script.js" ></script> <!-- Vincular el script -->
    </head>

    <body>

        <!-- Enlace a página monodrogas_medicamento.html  -->
        <a href="monodrogas_medicamento.html">medicamento_monodroga</a>

        <!-- Mostrar tabla de monodrogas -->
        <h2>Lista de Monodrogas</h2>

            <input type="text" id="busqueda" placeholder="Buscar por nombre..." onkeyup="filtrarTabla()"> <!-- Agregar el evento onkeyup para filtrar contenido de la tabla por nombre-->
            <input type="number" id="cod" placeholder="Buscar por id..." onkeyup="filtrarTablaID()">      <!-- Agregar el evento onkeyup para filtrar contenido de la tabla por id-->
            <table id="tablaMonodrogas" border="1">
            <thead>
                <tr>
                <th>ID</th>
                <th>Nombre</th>       
                </tr>
            </thead>
            <tbody>
                <!-- Aquí se insertarán los datos dinámicamente -->
            </tbody>
            </table>
        
            <script>
            // Función asíncrona para cargar el contenido de la tabla con de monodrogas
                    async function cargarMonodrogas() {
                        try {
                            const response = await fetch("http://localhost:7000/monodroga");
                            if (!response.ok) throw new Error("Error en la solicitud: " + response.statusText);

                            const data = await response.json();
                            
                            const tbody = document.querySelector("#tablaMonodrogas tbody");
                            tbody.innerHTML = ""; // Limpiar tabla antes de llenarla

                            data.forEach(monodroga => {
                                const tr = document.createElement("tr");

                                const tdId = document.createElement("td");
                                tdId.textContent = monodroga.id;
                                tr.appendChild(tdId);

                                const tdNombre = document.createElement("td");
                                tdNombre.textContent = monodroga.nombre;
                                tr.appendChild(tdNombre);

                                tbody.appendChild(tr);
                            });

                        } catch (error) {
                            console.error("Error al cargar los monodrogas:", error);
                        }
                    }
                
                window.onload = cargarMonodrogas;
        
            </script>
        
    <!-- Formulario para agregar nuevas monodrogas a la base de datos -->
        <h2>Registro de Monodroga</h2>

            <form id="registroForm">
                    
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required><br><br>     

                <button type="submit">Registrar</button>

            </form>

            <script>
            // Función asíncrona para registrar una nueva monodroga en la base de datos
                document.getElementById("registroForm").addEventListener("submit", function(event) {
                    event.preventDefault();

                    let name = document.getElementById("nombre").value;
                    
                    fetch("http://localhost:7000/monodroga", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({name})
                    })
                    .then(response => response.json())
                    .then(data => alert(data.message))
                    .catch(error => console.error("Error:", error));
                });
            </script>

        <!--Formulario para modificar monodrogas en la propiedad indicada (al solo poseer un campo además del id la propiedad predeterminada es el nombre)  -->
        <h2>Modificar Monodroga</h2>

            <form id="registroFormUpdate_monodroga">

                <label for="id">Código de la Monodroga:</label>
                <input type="number" id="id" required><br><br>
                    
                <label for="nuevo_nombre">Nombre nuevo:</label>
                <input type="text" id="nuevo_nombre" required><br><br>     

                <button type="submit">Actualizar</button>

            </form>

            <script>
                // Función asíncrona para modificar una monodroga en la base de datos
                document.getElementById("registroFormUpdate_monodroga").addEventListener("submit", function(event) {
                    event.preventDefault();

                    let nuevo_valor = document.getElementById("nuevo_nombre").value;
                    let id= document.getElementById("id").value;
                    
                    fetch("http://localhost:7000/monodroga", {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({nuevo_valor, id})
                    })
                    .then(response => response.json())
                    .then(data => alert(data.message))
                    .catch(error => console.error("Error:", error));
                });
            </script>

        <!--Formulario para eliminar una monodroga de la base de datos a traves de su id -->
        <h2>Eliminar Monodroga</h2>

            <form id="registroFormDelete_monodroga">

                <label for="id_delete">Código de la Monodroga:</label>
                <input type="number" id="id_delete" required><br><br>
                    
                <button type="submit">Eliminar</button>

            </form>

            <script>
                // Función asíncrona para eliminar una monodroga en la base de datos
                document.getElementById("registroFormDelete_monodroga").addEventListener("submit", function(event) {
                    event.preventDefault();

                    let id_delete= document.getElementById("id_delete").value;
                    
                    fetch("http://localhost:7000/monodroga", {
                        method: "DELETE",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({id_delete})
                    })
                    .then(response => response.json())
                    .then(data => alert(data.message))
                    .catch(error => console.error("Error:", error));
                });
            </script>
        
        <!-- Formulario para agregar un nuevo medicamento a la base de datos -->
        <h2>Registro de Medicamento</h2>
            <form id="registroMedicamento">
                    
                <label for="nombre_medicamento">Nombre:</label>
                <input type="text" id="nombre_medicamento" required><br><br>     

                <label for="accion">Nombre:</label>
                <input type="text" id="accion" required><br><br>  

                <button type="submit">Registrar</button>

            </form>

            <script>
                // Función asíncrona para registrar un nuevo medicamento en la base de datos
                document.getElementById("registroMedicamento").addEventListener("submit", function(event) {
                    event.preventDefault();

                    let nombre_medicamento = document.getElementById("nombre_medicamento").value;
                    let accion = document.getElementById("accion").value;
                    
                    fetch("http://localhost:7000/medicamento", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({nombre_medicamento,accion})
                    })
                    .then(response => response.json())
                    .then(data => alert(data.message))
                    .catch(error => console.error("Error:", error));
                });
            </script>

    </body>

</html>
